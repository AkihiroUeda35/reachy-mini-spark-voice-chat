[project]
name = "spark-voice-chat"
version = "0.1.0"
description = "Qwen TTS-LLM-STT voice chat server and client on DGX spark"
requires-python = ">=3.13"
dependencies = [
    "reachy-mini==1.7.1",
    "langchain-core>=1.3.3",
    "langchain-deepseek>=1.0.1",
    "langgraph>=1.1.10",
    "numpy>=2.4.4",
    "pipecat-ai>=1.1.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]