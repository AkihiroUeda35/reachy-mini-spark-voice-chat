[project]
name = "spark-voice-chat"
version = "0.1.0"
description = "Qwen TTS-LLM-STT voice chat server and client on DGX spark"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.0.0",
    "gradio>=5.31.0",
    "opencv-python-headless>=4.10.0",
    "reachy-mini==1.8.0",
    "reachy-mini-dances-library>=0.2.1",
    "langchain-core>=1.3.3",
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "numpy>=2.4.4",
    "pillow>=12.0.0",
    "pipecat-ai>=1.1.0",
    "rich>=15.0.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "lib"}
py-modules = [
    "config",
    "jma_weather_tool",
    "langgraph_agent",
    "local_tts",
    "openai_model_registry",
    "reachy_audio",
    "reachy_conversation_tools",
    "whisper_asr",
]

[tool.setuptools.packages.find]
where = ["lib"]