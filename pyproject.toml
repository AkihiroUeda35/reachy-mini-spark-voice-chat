[project]
name = "spark-voice-chat"
version = "0.1.0"
description = "Qwen TTS-LLM-STT voice chat server and client on DGX spark"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.3.2",
    "langchain-deepseek>=1.0.1",
    "numpy>=2.2.5",
    "pipecat-ai>=1.1.0",
    "pydantic>=2.11.0",
    "sounddevice>=0.5.2",
    "soundfile>=0.13.1",
    "websockets>=15.0.1",
]

[tool.uv]
package = false