services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
      target: llm-runtime
      args:
        NGC_VLLM_IMAGE: ${QWEN_LLM_NGC_VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.04-py3}
    container_name: vllm_node
    restart: unless-stopped
    network_mode: host
    privileged: true
    ipc: host
    gpus: all
    environment:
      NCCL_IGNORE_CPU_AFFINITY: "1"
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface
      QWEN_LLM_MODEL: ${QWEN_LLM_MODEL:-sakamakismile/Huihui-Qwen3.6-27B-abliterated-NVFP4-MTP}
      QWEN_LLM_HOST: 0.0.0.0
      QWEN_LLM_PORT: "8010"
      QWEN_LLM_SERVED_MODEL_NAME: ${QWEN_LLM_SERVED_MODEL_NAME:-spark}
      QWEN_LLM_QUANTIZATION: ${QWEN_LLM_QUANTIZATION:-modelopt}
      QWEN_LLM_MAX_MODEL_LEN: ${QWEN_LLM_MAX_MODEL_LEN:-262144}
      QWEN_LLM_MAX_NUM_SEQS: ${QWEN_LLM_MAX_NUM_SEQS:-4}
      QWEN_LLM_KV_CACHE_DTYPE: ${QWEN_LLM_KV_CACHE_DTYPE:-fp8}
      QWEN_LLM_GPU_MEMORY_UTILIZATION: ${QWEN_LLM_GPU_MEMORY_UTILIZATION:-0.6}
      QWEN_LLM_REASONING_PARSER: ${QWEN_LLM_REASONING_PARSER:-qwen3}
      QWEN_LLM_ENABLE_AUTO_TOOL_CHOICE: ${QWEN_LLM_ENABLE_AUTO_TOOL_CHOICE:-1}
      QWEN_LLM_TOOL_CALL_PARSER: ${QWEN_LLM_TOOL_CALL_PARSER:-qwen3_coder}
      QWEN_LLM_SPECULATIVE_CONFIG: '{"method":"qwen3_5_mtp","num_speculative_tokens":4,"moe_backend":"triton"}'
    volumes:
      - ~/.cache/vllm:/root/.cache/vllm
      - ~/.cache/flashinfer:/root/.cache/flashinfer
      - ~/.triton:/root/.triton
      - ~/.cache/huggingface:/root/.cache/huggingface
  qwen3-tts:
    build:
      context: .
      dockerfile: Dockerfile
      target: tts-runtime
      args:
        NGC_VLLM_IMAGE: ${QWEN_TTS_NGC_VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.04-py3}
        VLLM_OMNI_REF: ${QWEN_TTS_VLLM_OMNI_REF:-main}
    ports:
      - "${QWEN_TTS_API_PORT:-8091}:8091"
    environment:
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice}
      QWEN_TTS_HOST: 0.0.0.0
      QWEN_TTS_PORT: 8091
      QWEN_TTS_GPU_MEMORY_UTILIZATION: ${QWEN_TTS_GPU_MEMORY_UTILIZATION:-0.1}
      QWEN_TTS_ENFORCE_EAGER: ${QWEN_TTS_ENFORCE_EAGER:-0} 
      QWEN_TTS_NO_ASYNC_CHUNK: ${QWEN_TTS_NO_ASYNC_CHUNK:-0}
    volumes:
      - ./tts/models:/models
    gpus: all
    ipc: host
    restart: unless-stopped

  voice-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: stt-runtime
    depends_on:
      - qwen3-tts
    ports:
      - "8020:8020"
    environment:
      STT_MODEL_SIZE: large-v3-turbo
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      STT_CPU_THREADS: ${STT_CPU_THREADS:-14}
      STT_NUM_WORKERS: ${STT_NUM_WORKERS:-1}
      STT_DEFAULT_LANGUAGE: ${STT_DEFAULT_LANGUAGE:-ja}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-1}
      STT_BEST_OF: ${STT_BEST_OF:-1}
      STT_CONDITION_ON_PREVIOUS_TEXT: ${STT_CONDITION_ON_PREVIOUS_TEXT:-0}
      OMP_NUM_THREADS: ${STT_CPU_THREADS:-14}
      TTS_UPSTREAM_BASE_URL: ${TTS_UPSTREAM_BASE_URL:-http://qwen3-tts:8091}
      TTS_UPSTREAM_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice}
      TTS_UPSTREAM_TIMEOUT: ${QWEN_TTS_TIMEOUT:-600}
      TTS_DEFAULT_TASK_TYPE: ${TTS_DEFAULT_TASK_TYPE:-CustomVoice}
      TTS_DEFAULT_LANGUAGE: ${TTS_DEFAULT_LANGUAGE:-Japanese}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-Ono_Anna}
      QWEN_TTS_VOICES_FILE: /voices/voices.json
    volumes:
      - ./stt/models:/models
      - ./tts/voices:/voices
    restart: unless-stopped
