services:
  vllm:
    build:
      context: ./spark-vllm-docker
      dockerfile: Dockerfile
      target: runner
      args:
        PRE_TRANSFORMERS: ${LLM_PRE_TRANSFORMERS:-0}
    entrypoint: ["sh", "/workspace/llm/run.sh"]
    container_name: vllm_node
    restart: unless-stopped
    network_mode: host
    privileged: true
    ipc: host
    gpus: all
    environment:
      NCCL_IGNORE_CPU_AFFINITY: "1"
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface
      LLM_PROFILE: ${LLM_PROFILE:-qwen3.6-27b}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_HOST: ${LLM_HOST:-}
      LLM_PORT: ${LLM_PORT:-}
      LLM_SERVED_MODEL_NAME: ${LLM_SERVED_MODEL_NAME:-}
      LLM_QUANTIZATION: ${LLM_QUANTIZATION:-}
      LLM_MAX_MODEL_LEN: ${LLM_MAX_MODEL_LEN:-}
      LLM_MAX_NUM_SEQS: ${LLM_MAX_NUM_SEQS:-}
      LLM_KV_CACHE_DTYPE: ${LLM_KV_CACHE_DTYPE:-}
      LLM_GPU_MEMORY_UTILIZATION: ${LLM_GPU_MEMORY_UTILIZATION:-}
      LLM_REASONING_PARSER: ${LLM_REASONING_PARSER:-}
      LLM_ENABLE_AUTO_TOOL_CHOICE: ${LLM_ENABLE_AUTO_TOOL_CHOICE:-}
      LLM_TOOL_CALL_PARSER: ${LLM_TOOL_CALL_PARSER:-}
      LLM_SPECULATIVE_CONFIG: ${LLM_SPECULATIVE_CONFIG:-}
      LLM_TENSOR_PARALLEL_SIZE: ${LLM_TENSOR_PARALLEL_SIZE:-}
      LLM_ENABLE_PREFIX_CACHING: ${LLM_ENABLE_PREFIX_CACHING:-}
      LLM_GENERATION_CONFIG: ${LLM_GENERATION_CONFIG:-}
      LLM_EXTRA_ARGS: ${LLM_EXTRA_ARGS:-}
    volumes:
      - ./llm:/workspace/llm:ro
      - ~/.cache/vllm:/root/.cache/vllm
      - ~/.cache/flashinfer:/root/.cache/flashinfer
      - ~/.triton:/root/.triton
      - ~/.cache/huggingface:/root/.cache/huggingface

  qwen3-tts:
    build:
      context: .
      dockerfile: Dockerfile
      target: tts-runtime
      args:
        NGC_VLLM_IMAGE: ${QWEN_TTS_NGC_VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.04-py3}
        VLLM_OMNI_REF: ${QWEN_TTS_VLLM_OMNI_REF:-main}
    entrypoint: ["sh", "/workspace/tts/run.sh"]
    ports:
      - "${QWEN_TTS_API_PORT:-8091}:8091"
    environment:
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
      QWEN_TTS_HOST: 0.0.0.0
      QWEN_TTS_PORT: 8091
      QWEN_TTS_GPU_MEMORY_UTILIZATION: ${QWEN_TTS_GPU_MEMORY_UTILIZATION:-0.1}
      QWEN_TTS_ENFORCE_EAGER: ${QWEN_TTS_ENFORCE_EAGER:-0} 
      QWEN_TTS_NO_ASYNC_CHUNK: ${QWEN_TTS_NO_ASYNC_CHUNK:-0}
    volumes:
      - ./tts:/workspace/tts:ro
      - ./tts/models:/models
    gpus: all
    ipc: host
    restart: unless-stopped

  tsukasa-speech:
    build:
      context: .
      dockerfile: Dockerfile
      target: tsukasa-runtime
    environment:
      HF_HOME: /models/huggingface
      TSUKASA_SPEECH_HOST: 0.0.0.0
      TSUKASA_SPEECH_PORT: 5001
      TSUKASA_SPEECH_REPO_ID: ${TSUKASA_SPEECH_REPO_ID:-Respair/Tsukasa_Speech}
      TSUKASA_SPEECH_REPO_REF: ${TSUKASA_SPEECH_REPO_REF:-main}
      TSUKASA_SPEECH_REPO_DIR: /models/tsukasa_speech/repo
      TSUKASA_SPEECH_DEFAULT_VOICE: ${TSUKASA_SPEECH_DEFAULT_VOICE:-shiki_fine05}
    ports:
      - "${TSUKASA_SPEECH_PORT:-5001}:5001"
    volumes:
      - ./tts/tsukasa_speech:/workspace/tts/tsukasa_speech:ro
      - ./tts/models/tsukasa_speech:/models/tsukasa_speech
      - ~/.cache/huggingface:/models/huggingface
    gpus: all
    ipc: host
    restart: unless-stopped

  voice-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: stt-runtime
      args:
        NGC_VLLM_IMAGE: ${STT_NGC_VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.04-py3}
    ports:
      - "${VOICE_SERVER_PORT:-8020}:8020"
    gpus: all
    environment:
      STT_MODEL_SIZE: ${STT_MODEL_SIZE:-RoachLin/kotoba-whisper-v2.2-faster}
      STT_MODEL_ID: ${STT_MODEL_ID:-RoachLin/kotoba-whisper-v2.2-faster}
      STT_DEVICE: cuda
      STT_COMPUTE_TYPE: float16
      STT_CPU_THREADS: ${STT_CPU_THREADS:-14}
      STT_NUM_WORKERS: ${STT_NUM_WORKERS:-1}
      STT_DEFAULT_LANGUAGE: ${STT_DEFAULT_LANGUAGE:-auto}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-1}
      STT_BEST_OF: ${STT_BEST_OF:-1}
      STT_CONDITION_ON_PREVIOUS_TEXT: ${STT_CONDITION_ON_PREVIOUS_TEXT:-0}
      OMP_NUM_THREADS: ${STT_CPU_THREADS:-14}
      TTS_BACKEND: ${TTS_BACKEND:-qwen3-tts}
      TTS_UPSTREAM_BASE_URL: ${TTS_UPSTREAM_BASE_URL:-}
      TTS_UPSTREAM_MODEL: ${TTS_UPSTREAM_MODEL:-}
      TTS_PUBLIC_MODEL_NAME: ${TTS_PUBLIC_MODEL_NAME:-}
      TTS_UPSTREAM_TIMEOUT: ${QWEN_TTS_TIMEOUT:-600}
      TTS_DEFAULT_TASK_TYPE: ${TTS_DEFAULT_TASK_TYPE:-CustomVoice}
      TTS_DEFAULT_LANGUAGE: ${TTS_DEFAULT_LANGUAGE:-Japanese}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-default}
      TTS_TEMPERATURE: ${TTS_TEMPERATURE:-}
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
      QWEN_TTS_VOICES_FILE: /workspace/tts/voices/voices.json
      TSUKASA_SPEECH_BASE_URL: ${TSUKASA_SPEECH_BASE_URL:-http://tsukasa-speech:5001}
      TSUKASA_SPEECH_MODEL: ${TSUKASA_SPEECH_MODEL:-Respair/Tsukasa_Speech}
      TSUKASA_SPEECH_PUBLIC_MODEL_NAME: ${TSUKASA_SPEECH_PUBLIC_MODEL_NAME:-Respair/Tsukasa_Speech}
      TSUKASA_SPEECH_DEFAULT_VOICE: ${TSUKASA_SPEECH_DEFAULT_VOICE:-shiki_fine05}
      TSUKASA_SPEECH_DEFAULT_DIFFUSION_STEPS: ${TSUKASA_SPEECH_DEFAULT_DIFFUSION_STEPS:-5}
      TSUKASA_SPEECH_DEFAULT_EMBEDDING_SCALE: ${TSUKASA_SPEECH_DEFAULT_EMBEDDING_SCALE:-1.0}
      TSUKASA_SPEECH_DEFAULT_ALPHA: ${TSUKASA_SPEECH_DEFAULT_ALPHA:-0.3}
      TSUKASA_SPEECH_DEFAULT_BETA: ${TSUKASA_SPEECH_DEFAULT_BETA:-0.7}
      TSUKASA_SPEECH_SAMPLE_RATE: ${TSUKASA_SPEECH_SAMPLE_RATE:-24000}
    volumes:
      - ./stt:/app:ro
      - ./tts:/workspace/tts:ro
      - ./stt/models:/models
    restart: unless-stopped
