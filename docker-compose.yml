services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
      target: llm-runtime
      args:
        NGC_VLLM_IMAGE: ${LLM_NGC_VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.04-py3}
    entrypoint: ["sh", "/workspace/llm/run.sh"]
    container_name: vllm_node
    restart: unless-stopped
    network_mode: host
    privileged: true
    ipc: host
    gpus: all
    environment:
      NCCL_IGNORE_CPU_AFFINITY: "1"
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface
      LLM_PROFILE: ${LLM_PROFILE:-qwen3.6-27b}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_HOST: ${LLM_HOST:-}
      LLM_PORT: ${LLM_PORT:-}
      LLM_SERVED_MODEL_NAME: ${LLM_SERVED_MODEL_NAME:-}
      LLM_QUANTIZATION: ${LLM_QUANTIZATION:-}
      LLM_MAX_MODEL_LEN: ${LLM_MAX_MODEL_LEN:-}
      LLM_MAX_NUM_SEQS: ${LLM_MAX_NUM_SEQS:-}
      LLM_KV_CACHE_DTYPE: ${LLM_KV_CACHE_DTYPE:-}
      LLM_GPU_MEMORY_UTILIZATION: ${LLM_GPU_MEMORY_UTILIZATION:-}
      LLM_REASONING_PARSER: ${LLM_REASONING_PARSER:-}
      LLM_ENABLE_AUTO_TOOL_CHOICE: ${LLM_ENABLE_AUTO_TOOL_CHOICE:-}
      LLM_TOOL_CALL_PARSER: ${LLM_TOOL_CALL_PARSER:-}
      LLM_SPECULATIVE_CONFIG: ${LLM_SPECULATIVE_CONFIG:-}
      LLM_TENSOR_PARALLEL_SIZE: ${LLM_TENSOR_PARALLEL_SIZE:-}
      LLM_ENABLE_PREFIX_CACHING: ${LLM_ENABLE_PREFIX_CACHING:-}
      LLM_GENERATION_CONFIG: ${LLM_GENERATION_CONFIG:-}
      LLM_EXTRA_ARGS: ${LLM_EXTRA_ARGS:-}
    volumes:
      - ./llm:/workspace/llm:ro
      - ~/.cache/vllm:/root/.cache/vllm
      - ~/.cache/flashinfer:/root/.cache/flashinfer
      - ~/.triton:/root/.triton
      - ~/.cache/huggingface:/root/.cache/huggingface
  qwen3-tts:
    build:
      context: .
      dockerfile: Dockerfile
      target: tts-runtime
      args:
        NGC_VLLM_IMAGE: ${QWEN_TTS_NGC_VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.04-py3}
        VLLM_OMNI_REF: ${QWEN_TTS_VLLM_OMNI_REF:-main}
    entrypoint: ["sh", "/workspace/tts/run.sh"]
    ports:
      - "${QWEN_TTS_API_PORT:-8091}:8091"
    environment:
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
      QWEN_TTS_HOST: 0.0.0.0
      QWEN_TTS_PORT: 8091
      QWEN_TTS_GPU_MEMORY_UTILIZATION: ${QWEN_TTS_GPU_MEMORY_UTILIZATION:-0.1}
      QWEN_TTS_ENFORCE_EAGER: ${QWEN_TTS_ENFORCE_EAGER:-0} 
      QWEN_TTS_NO_ASYNC_CHUNK: ${QWEN_TTS_NO_ASYNC_CHUNK:-0}
    volumes:
      - ./tts:/workspace/tts:ro
      - ./tts/models:/models
    gpus: all
    ipc: host
    restart: unless-stopped

  voice-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: stt-runtime
      args:
        NGC_VLLM_IMAGE: ${STT_NGC_VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.04-py3}
    depends_on:
      - qwen3-tts
    ports:
      - "${VOICE_SERVER_PORT:-8020}:8020"
    gpus: all
    environment:
      STT_MODEL_SIZE: ${STT_MODEL_SIZE:-RoachLin/kotoba-whisper-v2.2-faster}
      STT_MODEL_ID: ${STT_MODEL_ID:-RoachLin/kotoba-whisper-v2.2-faster}
      STT_DEVICE: cuda
      STT_COMPUTE_TYPE: float16
      STT_CPU_THREADS: ${STT_CPU_THREADS:-14}
      STT_NUM_WORKERS: ${STT_NUM_WORKERS:-1}
      STT_DEFAULT_LANGUAGE: ${STT_DEFAULT_LANGUAGE:-ja}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-1}
      STT_BEST_OF: ${STT_BEST_OF:-1}
      STT_CONDITION_ON_PREVIOUS_TEXT: ${STT_CONDITION_ON_PREVIOUS_TEXT:-0}
      OMP_NUM_THREADS: ${STT_CPU_THREADS:-14}
      TTS_UPSTREAM_BASE_URL: ${TTS_UPSTREAM_BASE_URL:-http://qwen3-tts:8091}
      TTS_UPSTREAM_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
      TTS_PUBLIC_MODEL_NAME: ${TTS_PUBLIC_MODEL_NAME:-Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
      TTS_UPSTREAM_TIMEOUT: ${QWEN_TTS_TIMEOUT:-600}
      TTS_DEFAULT_TASK_TYPE: ${TTS_DEFAULT_TASK_TYPE:-CustomVoice}
      TTS_DEFAULT_LANGUAGE: ${TTS_DEFAULT_LANGUAGE:-Japanese}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-Ono_Anna}
      QWEN_TTS_VOICES_FILE: /workspace/tts/voices/voices.json
    volumes:
      - ./stt:/app:ro
      - ./tts:/workspace/tts:ro
      - ./stt/models:/models
    restart: unless-stopped
