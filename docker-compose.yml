services:
  vllm:
    entrypoint:
      - /opt/nvidia/nvidia_entrypoint.sh
      - /bin/bash
      - -lc
    command:
      - |
        exec vllm serve sakamakismile/Huihui-Qwen3.6-27B-abliterated-NVFP4-MTP \
          --trust-remote-code \
          --served-model-name spark \
          --quantization modelopt \
          --max-model-len 262144 \
          --max-num-seqs 4 \
          --port 8010 \
          --kv-cache-dtype fp8 \
          --gpu-memory-utilization 0.6 \
          --reasoning-parser qwen3 \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --speculative-config '{"method":"qwen3_5_mtp","num_speculative_tokens":4,"moe_backend":"triton"}'
    image: vllm-node
    container_name: vllm_node
    restart: unless-stopped
    network_mode: host
    privileged: true
    ipc: host
    gpus: all
    environment:
      - NCCL_IGNORE_CPU_AFFINITY=1
    volumes:
      - ~/.cache/vllm:/root/.cache/vllm
      - ~/.cache/flashinfer:/root/.cache/flashinfer
      - ~/.triton:/root/.triton
      - ~/.cache/huggingface:/root/.cache/huggingface
  qwen3-tts:
    build:
      context: ./tts-stt-server
      dockerfile: qwen3-tts-backend/Dockerfile
      args:
        NGC_VLLM_IMAGE: ${QWEN_TTS_NGC_VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.04-py3}
        VLLM_VERSION: ${QWEN_TTS_VLLM_VERSION:-0.20.0}
        VLLM_OMNI_REF: ${QWEN_TTS_VLLM_OMNI_REF:-main}
    ports:
      - "${QWEN_TTS_API_PORT:-8091}:8091"
    environment:
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice}
      QWEN_TTS_HOST: 0.0.0.0
      QWEN_TTS_PORT: 8091
      QWEN_TTS_GPU_MEMORY_UTILIZATION: ${QWEN_TTS_GPU_MEMORY_UTILIZATION:-0.1}
      QWEN_TTS_ENFORCE_EAGER: ${QWEN_TTS_ENFORCE_EAGER:-1}
      QWEN_TTS_NO_ASYNC_CHUNK: ${QWEN_TTS_NO_ASYNC_CHUNK:-0}
    volumes:
      - ./tts-stt-server/models:/models
    gpus: all
    ipc: host
    restart: unless-stopped

  voice-server:
    build:
      context: ./tts-stt-server
      dockerfile: Dockerfile
    depends_on:
      - qwen3-tts
    ports:
      - "8020:8020"
    environment:
      STT_MODEL_SIZE: base
      STT_DEVICE: cpu
      STT_COMPUTE_TYPE: int8
      TTS_UPSTREAM_BASE_URL: ${TTS_UPSTREAM_BASE_URL:-http://qwen3-tts:8091}
      TTS_UPSTREAM_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice}
      TTS_UPSTREAM_TIMEOUT: ${QWEN_TTS_TIMEOUT:-600}
      TTS_DEFAULT_TASK_TYPE: ${TTS_DEFAULT_TASK_TYPE:-CustomVoice}
      TTS_DEFAULT_LANGUAGE: ${TTS_DEFAULT_LANGUAGE:-Japanese}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-Ono_Anna}
      QWEN_TTS_VOICES_FILE: /voices/voices.json
    volumes:
      - ./tts-stt-server/models:/models
      - ./tts-stt-server/voices:/voices
    restart: unless-stopped
